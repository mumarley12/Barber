# O Supabase gratuito pausa o projeto depois de uma semana sem uso.
# Esta consulta a cada 3 dias mantém o banco ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta pública ao banco
        env:
          SUPABASE_URL: https://jwdrxueavpiwqjqtkokv.supabase.co
          SUPABASE_KEY: sb_publishable_nY5B4dpuktrItVZyMiGFlA_NQvtwVQu
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/shops?select=slug&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
